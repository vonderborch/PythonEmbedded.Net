name: Release

on:
  push:
    tags: ["v*"] # library release: pack + publish core and satellites
    branches: [main]
    paths: ["source/Runtimes/manifest.json"] # merged runtime refresh: publish runtime packages
  workflow_dispatch:
    inputs:
      publish_runtimes:
        description: "Also publish PythonEmbedded.Net.Runtime.* packages"
        type: boolean
        default: false

jobs:
  library:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Pack library packages
        run: |
          mkdir -p packages
          dotnet pack source/PythonEmbedded.Net/PythonEmbedded.Net.csproj -c Release -o packages
          for project in source/PackageManagers/*/*.csproj source/Runners/*/*.csproj source/Sources/*/*.csproj; do
            [ -e "$project" ] && dotnet pack "$project" -c Release -o packages
          done
      - name: Publish to NuGet
        run: dotnet nuget push "packages/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

  runtimes:
    if: startsWith(github.ref, 'refs/heads/main') || inputs.publish_runtimes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Pack runtime packages (downloads + verifies archives)
        run: |
          mkdir -p packages
          for project in source/Runtimes/PythonEmbedded.Net.Runtime.Python*/*.csproj; do
            dotnet pack "$project" -c Release -o packages
          done
      - name: Publish to NuGet
        run: dotnet nuget push "packages/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
