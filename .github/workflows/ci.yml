name: CI

on:
  push:
    branches: [main, v2alt]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * *" # nightly full run including network tests

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        tfm: [net8.0, net9.0, net10.0]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Cache Python fixtures
        uses: actions/cache@v4
        with:
          path: test/fixtures
          key: fixtures-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('test/tools/fetch-fixtures.sh') }}

      - name: Fetch Python fixtures
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./test/tools/fetch-fixtures.sh

      - name: Unit tests
        run: dotnet test test/automated/PythonEmbedded.Net.Test/PythonEmbedded.Net.Test.csproj -c Release -f ${{ matrix.tfm }}

      - name: Integration tests (offline)
        if: github.event_name != 'schedule'
        run: dotnet test test/automated/PythonEmbedded.Net.IntegrationTest/PythonEmbedded.Net.IntegrationTest.csproj -c Release -f ${{ matrix.tfm }} --filter "TestCategory!=RequiresNetwork"

      - name: Integration tests (full, nightly)
        if: github.event_name == 'schedule'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet test test/automated/PythonEmbedded.Net.IntegrationTest/PythonEmbedded.Net.IntegrationTest.csproj -c Release -f ${{ matrix.tfm }}
