name: Refresh runtime packages

# Daily: if astral-sh/python-build-standalone published a new tag, regenerate the
# runtime manifest + per-project archives.props and open a PR. Merging that PR
# triggers release.yml's runtime-package publish job.

on:
  schedule:
    - cron: "42 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 source/Runtimes/tools/update-manifest.py

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Verify runtime packages pack cleanly
        run: |
          mkdir -p /tmp/packverify
          for project in source/Runtimes/PythonEmbedded.Net.Runtime.Python*/*.csproj; do
            dotnet pack "$project" -c Release -o /tmp/packverify
          done

      - name: Open PR if anything changed
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Update runtime manifest to latest python-build-standalone release"
          title: "Update runtime packages to latest python-build-standalone release"
          body: |
            Automated update of `source/Runtimes/manifest.json` and the per-project
            `archives.props` files to the latest astral-sh/python-build-standalone release.

            Merging publishes updated `PythonEmbedded.Net.Runtime.*` packages.
          branch: auto/refresh-runtimes
          delete-branch: true

      - name: Enable auto-merge
        if: steps.cpr.outputs.pull-request-number
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --auto --squash "${{ steps.cpr.outputs.pull-request-number }}"
